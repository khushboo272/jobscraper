services:
  # --- API Server ---
  - type: web
    name: job-ingestion-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_PORT
        value: "6379"

  # --- Sandbox Hostile Source ---
  - type: web
    name: job-ingestion-sandbox
    env: node
    region: oregon
    plan: free
    rootDir: apps/sandbox-source
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SANDBOX_PORT
        value: "3001"