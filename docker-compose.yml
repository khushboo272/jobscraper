# docker-compose.yml — Local dev services for Job Ingestion Engine
# Usage: docker compose up -d

version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: job-ingestion-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: job-ingestion-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  mongo-data:
